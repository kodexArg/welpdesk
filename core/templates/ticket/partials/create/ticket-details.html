<article id="ticket-details-container">
    <div id="title-container">
        <label>Detalles del Ticket:</label>
    </div>

    <div id="body-container">
        <textarea name="body" rows="4" id="body" placeholder="{{ issue.description }}"></textarea>
    </div>

    <div id="date-picker-container">
        <label onclick="prepareAndShowDatePicker(event)" class="hover:brightness-110 cursor-pointer hover:scale-101 transition-all duration-300">
            <i class="fa fa-calendar"></i>
            fecha y hora de reporte
            <input class="hidden"
                   type="hidden"
                   name="reported_on"
                   id="reported_on"
                   value="{% if ticket.reported_on %}{{ ticket.reported_on|date:'Y-m-d\TH:i' }}{% endif %}">
            <input type="datetime-local"
                   class="select-none pointer-events-none absolute top-0 left-0"
                   id="date_picker"
                   style="opacity: 0; position: absolute; z-index: -1;"
                   onchange="updateReportedDate(this.value)">
        </label>
        <div id="date-visualization-container">
            <span id="date-text-content" class="text-sm italic text-gray-700"></span>
            <button type="button"
                    id="clear-date"
                    onclick="resetReportedDate()">
            </button>
        </div>
    </div>

    <div id="attachments-container">
        <div>
            <span></span>
        </div>
        <div id="attachments-list">
        </div>
        <button type="button" id="add-attachment"
                hx-post="{% url 'htmx-add-attachment' %}"
                hx-target="#attachments-list"
                hx-swap="beforeend"
                hx-include="form">
            Adjuntar
        </button>
    </div>

    <div id="ticket-details-error"></div>
</article>

<script>
    window.attachmentIndices = [];

    function updateFilename(fileInput, index) {
        if (!window.attachmentIndices.includes(index)) {
            window.attachmentIndices.push(index);
        }

        const nameInput = document.getElementById(`attachment-name-${index}`);
        if (!nameInput) {
            console.error(`No se encontró el input name con id=attachment-name-${index}`);
            return;
        }

        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            nameInput.value = file.name;
        } else {
            nameInput.value = '';
        }
    }

    function prepareAndShowDatePicker(event) {
        event.preventDefault(); // Prevenir el comportamiento por defecto
        const datePicker = document.getElementById('date_picker');

        // Usar setTimeout con 0ms para llamar a showPicker() *después*
        // de que el navegador haya enfocado el input.
        setTimeout(() => {
            try {
                datePicker.showPicker();
            } catch (error) {
                console.error("Error al mostrar el selector:", error);
                // Fallback: simular un clic (menos confiable)
                datePicker.click();
            }
        }, 0);
    }

      // Función para actualizar la fecha reportada
    function updateReportedDate(dateValue) {
        const reportedOnInput = document.getElementById('reported_on');
        const reportedOnDisplay = document.getElementById('reported_on_display');
        const clearDateButton = document.getElementById('clear-date');
        const dateTextContent = document.getElementById('date-text-content');

        if (dateValue) {
            reportedOnInput.value = dateValue;

            const date = new Date(dateValue);
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            };
            const formattedDate = date.toLocaleDateString('es-ES', options)
                .replace(/^\w/, c => c.toUpperCase());

            dateTextContent.textContent = formattedDate;
            clearDateButton.classList.remove('hidden');
        } else {
            reportedOnInput.value = '';
            dateTextContent.textContent = '';
            clearDateButton.classList.add('hidden');
        }
    }

    // Función para limpiar la fecha
    function resetReportedDate() {
        document.getElementById('reported_on').value = '';
        document.getElementById('date-text-content').textContent = '';
        document.querySelector('#date-visualization-container span').textContent = '';
        document.getElementById('date_picker').value = '';
        document.getElementById('clear-date').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        if (form) {
            if (!form.getAttribute('enctype') || form.getAttribute('enctype') !== 'multipart/form-data') {
                form.setAttribute('enctype', 'multipart/form-data');
            }

            let indexTracker = document.getElementById('attachment-highest-index');
            if (!indexTracker) {
                indexTracker = document.createElement('input');
                indexTracker.type = 'hidden';
                indexTracker.name = 'attachment-highest-index';
                indexTracker.id = 'attachment-highest-index';
                indexTracker.value = '0';
                form.appendChild(indexTracker);
            }
        } else {
            console.error('No se encontró ningún formulario en la página');
        }
    });

    document.addEventListener('htmx:afterSwap', function(event) {
        if (event.detail.target.id === 'attachments-list') {
            const indexTracker = document.getElementById('attachment-highest-index');
            if (indexTracker && window.attachmentIndices.length > 0) {
                indexTracker.value = Math.max(...window.attachmentIndices);
            }
        }
    });
</script>
