{% extends "base/layout.html" %}

{% block title %}WelpDesk - Lista de Tickets{% endblock %}

{% block content %}
<section>
    <h2>Lista de Tickets</h2>
    <div id="list-container">
        <div
            hx-get="{% url 'ticket-list' %}{% if request.GET.urlencode %}?{{ request.GET.urlencode }}{% endif %}"
            hx-trigger="load"
            hx-target="#list-container">
            <p>Cargando...</p>
        </div>
    </div>
    
    
</section>
{% endblock %}
