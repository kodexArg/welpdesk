{% extends "base/layout.html" %}

{% block title %}Cerrar sesión{% endblock %}

{% block content %}
<div class="container">
    <div class="row" style="margin-top: 4rem; text-align: center;">
        <div class="six columns offset-by-three">
            <div class="logout-container">
                <h2>Sesión cerrada</h2>
                
                <div class="redirect-container">
                    <div class="pulse-circle"></div>
                    <p>Redireccionando al inicio en</p>
                    <div id="countdown" class="countdown text-6xl font-black">10</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        let count = 10;
        const countdownElement = document.getElementById('countdown');
        
        // Actualizar el contador cada segundo
        const interval = setInterval(function() {
            count--;
            countdownElement.textContent = count;
            
            // Añadir clase para la animación y quitarla después
            countdownElement.classList.add('countdown-beat');
            setTimeout(() => {
                countdownElement.classList.remove('countdown-beat');
            }, 900);
            
            // Cuando llegue a cero, redirigir
            if (count <= 0) {
                clearInterval(interval);
                window.location.href = "{% url 'home' %}";
            }
        }, 1000);
    });
</script>
{% endblock %}

<style>
    .logout-container {
        background-color: var(--card-background);
        border: 0.0625rem solid var(--border-color);
        border-radius: 0.375rem;
        padding: 2rem;
        box-shadow: 0 0.125rem 0.625rem rgba(0, 0, 0, 0.05);
    }
    
    .logout-container h2 {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .redirect-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 2rem 0;
    }
    
    .countdown {
        font-weight: 900;
        color: var(--primary-color);
        margin-top: 0.5rem;
        transition: all 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    
    .countdown-beat {
        animation: heartBeat 1s ease-in-out;
    }
    
    @keyframes heartBeat {
        0% {
            transform: scale(1);
        }
        14% {
            transform: scale(1.3);
            color: var(--primary-hover);
            text-shadow: 0 0 10px rgba(var(--primary-color-rgb), 0.5);
        }
        28% {
            transform: scale(1);
        }
        42% {
            transform: scale(1.2);
            color: var(--primary-hover);
            text-shadow: 0 0 10px rgba(var(--primary-color-rgb), 0.5);
        }
        70% {
            transform: scale(1);
        }
    }
    
    .pulse-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: rgba(var(--primary-color-rgb), 0.2);
        margin-bottom: 1rem;
        position: relative;
        animation: pulse 2s infinite;
    }
    
    .pulse-circle:before {
        content: "";
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: rgba(var(--primary-color-rgb), 0.4);
        top: 10px;
        left: 10px;
    }
    
    .pulse-circle:after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: var(--primary-color);
        top: 20px;
        left: 20px;
    }
    
    @keyframes pulse {
        0% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(var(--primary-color-rgb), 0.7);
        }
        
        70% {
            transform: scale(1);
            box-shadow: 0 0 0 15px rgba(var(--primary-color-rgb), 0);
        }
        
        100% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(var(--primary-color-rgb), 0);
        }
    }
</style>
