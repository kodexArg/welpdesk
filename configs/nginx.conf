server {
    listen 80;
    # Escucha en el puerto 80 (externo)

    server_name localhost;
    # Responde a peticiones para localhost. Puedes añadir tu dominio si despliegas.

    # Tamaño máximo para archivos subidos (ej. 50MB), ajusta según necesites
    client_max_body_size 50M;

    location / {
        # Pasa todas las peticiones no estáticas/media a la aplicación Django (gunicorn) en el puerto 8080
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off; # Evita redirecciones inesperadas
    }

    location /static/ {
        # Sirve archivos estáticos directamente desde el volumen montado
        alias /staticfiles/;
        expires 30d; # Cachea por 30 días
        add_header Cache-Control "public";
    }

    location /media/ {
        # Sirve archivos multimedia directamente desde el volumen montado
        alias /mediafiles/;
        expires 30d; # Cachea por 30 días
        add_header Cache-Control "public";
    }
}